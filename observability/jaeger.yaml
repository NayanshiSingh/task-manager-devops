# Jaeger all-in-one (in-memory) for local trace collection via OTLP/HTTP on 4318.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels: { app: jaeger }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
