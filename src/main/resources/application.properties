# Application Configuration
spring.application.name=task-manager

# Server Configuration
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-stacktrace=never

# Database (credentials are injected from a Kubernetes Secret, never committed)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasks}
spring.datasource.username=${DB_USERNAME:tasks}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Actuator: liveness = process only, readiness = process + database
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=true
management.info.build.enabled=true
info.app.commit=${GIT_SHA:local}
info.app.image-tag=${IMAGE_TAG:local}

# Metrics: latency histograms for SLO calculations
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s

# Tracing: OTLP export to Jaeger, toggled per environment
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Logging: JSON (ECS) to stdout with traceId/spanId for correlation
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.level.com.taskmanager=INFO
