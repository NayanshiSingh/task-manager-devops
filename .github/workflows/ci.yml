# ==============================================================================
# Task Manager API - CI/CD Pipeline
# ==============================================================================
# PR and push to main:
#   test -> (sast, security-scan, helm-lint) -> image (build + Trivy gate)
#        -> e2e (deploy the exact image to an ephemeral kind cluster with Helm,
#                run the user-journey smoke test and an OWASP ZAP baseline scan)
# Push to main only:
#   publish -> push the tested image to GHCR tagged with the commit SHA
# Release to the (local) cluster is a deliberate manual step:
#   PULL=1 scripts/deploy-local.sh <sha>
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  IMAGE: ghcr.io/${{ github.repository_owner }}/task-manager-devops

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Checkstyle (blocking)
        run: mvn -B checkstyle:check
      - name: Unit & API tests
        run: mvn -B verify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - run: mvn -B compile -DskipTests
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java

  security-scan:
    name: Secrets, SCA & IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency scan (Trivy fs, blocks on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Misconfiguration scan (Dockerfile + Helm, report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          severity: HIGH,CRITICAL
          exit-code: '0'

  helm-lint:
    name: Helm lint & schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every environment
        run: |
          for v in values-ci.yaml values-local.yaml; do
            helm lint helm/task-manager -f helm/task-manager/$v --set image.tag=${{ github.sha }}
            helm template t helm/task-manager -f helm/task-manager/$v --set image.tag=${{ github.sha }} > rendered-$v
          done
      - name: Validate against Kubernetes schemas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas rendered-*.yaml

  image:
    name: Build & scan image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image tagged with commit SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image scan (Trivy, blocks on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Export image for downstream jobs
        run: docker save ${{ env.IMAGE }}:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 3

  e2e:
    name: Deploy to kind + E2E + DAST
    runs-on: ubuntu-latest
    needs: [image, helm-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: image
      - uses: azure/setup-helm@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - name: Load image into kind
        run: |
          docker load -i image.tar
          kind load docker-image ${{ env.IMAGE }}:${{ github.sha }} --name kind
      - name: Helm release (atomic)
        env:
          IMAGE_REPO: ${{ env.IMAGE }}
          VALUES: helm/task-manager/values-ci.yaml
        run: scripts/deploy-local.sh ${{ github.sha }}
      - name: User-journey smoke test against the deployed version
        run: |
          kubectl -n task-manager port-forward svc/task-manager 8080:80 > /tmp/pf.log 2>&1 &
          sleep 5
          scripts/smoke-test.sh http://localhost:8080 ${{ github.sha }}
      - name: DAST (OWASP ZAP baseline)
        run: |
          docker run --rm --network host -v "$PWD":/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080/api/tasks -I -r zap-report.html || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html
          retention-days: 7
      - name: Diagnostics
        if: always()
        run: |
          kubectl -n task-manager get all,pvc,networkpolicy -o wide
          kubectl -n task-manager logs deploy/task-manager --tail=50
      - name: Summary
        run: |
          echo "### Deployed and verified :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s http://localhost:8080/actuator/info >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [e2e, sast, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact image that passed E2E
        run: |
          docker load -i image.tar
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          echo "### Published \`${{ env.IMAGE }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Release: \`PULL=1 scripts/deploy-local.sh ${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
