# ==============================================================================
# Task Manager API - CI Pipeline
# ==============================================================================
# This pipeline implements a complete CI workflow with:
# - Code quality checks (Checkstyle)
# - Security scans (CodeQL SAST, OWASP Dependency Check, Trivy)
# - Unit tests
# - Docker image build and push
# ==============================================================================

name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # Manual trigger

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager

jobs:
  # ============================================================================
  # Stage 1: Code Quality & Security Analysis
  # ============================================================================
  quality-and-security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      # ------------------------------------------
      # Checkout: Retrieve source code
      # Why: Required for all subsequent steps
      # ------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Java: Install JDK 17
      # Why: Required for Maven build and analysis
      # ------------------------------------------
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ------------------------------------------
      # Linting: Enforce coding standards
      # Why: Prevents technical debt, ensures consistency
      # ------------------------------------------
      - name: Run Checkstyle
        run: mvn checkstyle:check -B
        continue-on-error: true  # Don't fail pipeline on style issues

      # ------------------------------------------
      # SAST: Static Application Security Testing
      # Why: Detects OWASP Top 10 vulnerabilities
      # ------------------------------------------
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: mvn compile -B -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

      # ------------------------------------------
      # SCA: Software Composition Analysis
      # Why: Identifies supply-chain risks in dependencies
      # ------------------------------------------
      - name: OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check -B
        continue-on-error: true  # Report but don't block

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7

  # ============================================================================
  # Stage 2: Build & Test
  # ============================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: quality-and-security

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ------------------------------------------
      # Unit Tests: Validate business logic
      # Why: Prevents regressions, ensures correctness
      # ------------------------------------------
      - name: Run Unit Tests
        run: mvn test -B

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

      # ------------------------------------------
      # Build: Package application
      # Why: Creates deployable artifact
      # ------------------------------------------
      - name: Build Application
        run: mvn package -DskipTests -B

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

  # ============================================================================
  # Stage 3: Docker Build, Scan & Push
  # ============================================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ------------------------------------------
      # Docker Build: Create container image
      # Why: Containerization for consistent deployment
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker build -t ${{ env.DOCKER_IMAGE }}:latest .

      # ------------------------------------------
      # Container Scan: Detect vulnerabilities
      # Why: Prevents vulnerable images from shipping
      # ------------------------------------------
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'  # Report but don't fail
          severity: 'CRITICAL,HIGH'

      # ------------------------------------------
      # Runtime Test: Validate container behavior
      # Why: Ensures image is runnable
      # ------------------------------------------
      - name: Container Smoke Test
        run: |
          docker run -d --name test-container -p 8080:8080 ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          sleep 15
          curl --fail http://localhost:8080/actuator/health || exit 1
          docker logs test-container
          docker stop test-container

      # ------------------------------------------
      # Registry Push: Publish trusted image
      # Why: Enables downstream CD pipeline
      # ------------------------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to DockerHub
        run: |
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Image Push Summary
        run: |
          echo "### Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: ${{ env.DOCKER_IMAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ github.sha }}, latest" >> $GITHUB_STEP_SUMMARY
